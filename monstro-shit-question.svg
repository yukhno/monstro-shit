<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - MS Dynamics BS Interface -->
  <rect width="800" height="600" fill="#f0f0f0"/>
  
  <!-- Dynamics Navigation Bar -->
  <rect width="800" height="50" fill="#0078d7"/>
  <text x="20" y="30" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="white">Microsoft Dynamics 365 Business Central</text>
  
  <!-- Dynamics Menu Items -->
  <rect x="0" y="50" width="150" height="550" fill="#2a3f5f"/>
  <text x="20" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="white">Dashboard</text>
  <text x="20" y="110" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="white">Sales</text>
  <text x="20" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="white">Purchasing</text>
  <text x="20" y="170" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="white">Inventory</text>
  <text x="20" y="200" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="white">Finance</text>
  
  <!-- Dynamics Content Area with Tables -->
  <rect x="160" y="60" width="630" height="30" fill="#e6e6e6"/>
  <text x="180" y="80" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#333">Customer List</text>
  
  <!-- Table Headers -->
  <rect x="160" y="90" width="630" height="25" fill="#d0d0d0"/>
  <text x="170" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#333">ID</text>
  <text x="220" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#333">Name</text>
  <text x="350" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#333">Contact</text>
  <text x="480" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#333">Balance</text>
  <text x="600" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#333">Status</text>
  
  <!-- Table Rows -->
  <rect x="160" y="115" width="630" height="25" fill="white"/>
  <rect x="160" y="140" width="630" height="25" fill="#f9f9f9"/>
  <rect x="160" y="165" width="630" height="25" fill="white"/>
  <rect x="160" y="190" width="630" height="25" fill="#f9f9f9"/>
  
  <!-- Dark overlay for modal background -->
  <rect width="800" height="600" fill="rgba(0,0,0,0.5)"/>
  
  <!-- Error Modal Window with shadow effect -->
  <rect x="203" y="103" width="500" height="350" rx="5" ry="5" fill="rgba(0,0,0,0.3)"/>
  <rect x="200" y="100" width="500" height="350" rx="5" ry="5" fill="#ffffff" stroke="#999999" stroke-width="2"/>
  <rect x="200" y="100" width="500" height="30" rx="5" ry="5" fill="#0078d7"/>
  <text x="220" y="122" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="white">Dynamics Error</text>
  
  <!-- Window Close Button -->
  <rect x="670" y="100" width="30" height="30" fill="#0078d7"/>
  <text x="680" y="122" font-family="Arial, sans-serif" font-size="14" fill="white">✕</text>
  
  <!-- Meme Text -->
  <text x="450" y="250" font-family="Impact, Arial, sans-serif" font-size="36" text-anchor="middle" fill="#000000">Чё ЖоПа Те, МонстроШит?</text>
  
  <!-- Small Font Subtitle -->
  <text x="450" y="400" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="#555555">Enterprise-level frustration included.</text>
  
  <!-- Error Icon -->
  <circle cx="450" cy="330" r="40" fill="#ff0000"/>
  <text x="450" y="345" font-family="Arial, sans-serif" font-size="40" text-anchor="middle" fill="white">!</text>
  
  <!-- Additional UI elements -->
  <rect x="220" y="370" width="460" height="1" fill="#d0d0d0"/>
  
  <!-- Progress Spinner (simplified) -->
  <circle cx="250" cy="330" r="15" fill="none" stroke="#0078d7" stroke-width="3"/>
</svg>